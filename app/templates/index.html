<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text Stats Service</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 16px; }
    textarea { width: 100%; height: 120px; font-size: 15px; padding: 8px; }
    button { margin-top: 12px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
    pre { background: #f4f4f5; padding: 14px; border-radius: 6px; }
    .v { color: #777; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Text Stats Service</h1>
  <p class="v">version {{ version }} · DevOps pipeline demo</p>
  <textarea id="t" placeholder="Enter text..."></textarea>
  <button onclick="run()">Count</button>
  <pre id="out">—</pre>
  <script>
    async function run() {
      const r = await fetch('/api/stats?text=' + encodeURIComponent(document.getElementById('t').value));
      document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
